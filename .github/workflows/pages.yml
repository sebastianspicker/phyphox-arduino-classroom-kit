name: Validate static demo

on:
  push:
    branches: [main]
    paths:
      - "demo/**"
      - ".github/workflows/pages.yml"
      - "tests/test_demo_validation.py"
      - "tools/validate_demo.py"
  pull_request:
    paths:
      - "demo/**"
      - ".github/workflows/pages.yml"
      - "tests/test_demo_validation.py"
      - "tools/validate_demo.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Check demo JavaScript syntax
        run: node --check demo/demo.js

      - name: Validate static demo contract
        run: python3 tools/validate_demo.py

      - name: Test demo validation guardrails
        run: python3 -m unittest tests.test_demo_validation
